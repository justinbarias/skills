schema_version: "1.1"
name: port-tomli
expected_outcome: |
  A .NET 10 solution in dotnet/ that ports the tomli parser with the same
  behaviour as the Python original, including error message text. It builds
  with warnings as errors, its ported tests pass, a console project answers
  JSON-line calls, and a parity check compares the C# with outputs taken
  from the Python code. No stubs or port TODOs remain. SUMMARY.md says what
  was checked and what is unfinished.
